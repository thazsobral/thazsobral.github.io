<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Portfólio de Thalles Sobral - Desenvolvedor Fullstack.">
    
    <link rel="stylesheet" href="./assets/styles/style.css">
    <link rel="shortcut icon" href="./assets/images/favicon/glasses-16.png" type="image/x-icon">
    
    <title>Thalles Sobral | Desenvolvedor</title>
</head>
<body>
    <header>
        <div id="header-image">
            <img src="./assets/images/study-development.svg" alt="Ilustração de estudo e desenvolvimento">
        </div>
        
        <div id="perfil">
            <h1 id="name">Thalles Sobral</h1>
            <span id="status-text" aria-live="polite"></span>
            <script src="./assets/scripts/get-status.js"></script>
        </div>

        <button id="menu-toggle" aria-label="Abrir menu" onclick="document.body.classList.toggle('menu-open')">
            <span class="hamburger"></span>
        </button>

        <nav id="nav-container">
            <ul id="nav-list">
                <li><a href="#bio-resume" onclick="document.body.classList.remove('menu-open')">Bio</a></li>
                <li><a href="#tips-github" onclick="document.body.classList.remove('menu-open')">Dicas</a></li>
                <li><a href="#portfolio-github" onclick="document.body.classList.remove('menu-open')">Portfólio</a></li>
                <li><a href="#contact" onclick="document.body.classList.remove('menu-open')">Github</a></li>
            </ul>
        </nav>

        <!-- SEÇÃO DO SELETOR DE TEMA -->
        <div class="theme-switcher">
            <button onclick="themeToggle.setTheme('light')">☀️ Light</button>
            <button onclick="themeToggle.setTheme('dark')">🌙 Dark</button>
            <button onclick="themeToggle.setTheme('system')">🖥️ System</button>
            <script src="./assets/scripts/theme-toggle.js"></script>
        </div>
        <!-- FIM DA SEÇÃO DO SELETOR DE TEMA -->

        <script src="./assets/scripts/fixed-header-top.js"></script>
    </header>

    <main>
        <article>
            <section id="bio-resume" class="negative">
                <h2>Bio</h2>
                <script src="./assets/scripts/get-bio.js"></script>
            </section>

            <hr>

            <section id="tips-github">
                <h2>Últimas dicas</h2>
                <ul id="tips-list">
                    <script src="./assets/scripts/get-gists.js"></script>
                </ul>
            </section>

            <hr>

            <section id="portfolio-github">
                <h2>Portfólio</h2>
                <ul id="projects-list">
                    <script src="./assets/scripts/get-repos.js"></script>
                </ul>
            </section>
        </article>
    </main>

    <footer id="contact">
        <div class="footer-content">
            <div class="github-card-container">
                <div class="github-card" data-github="thazsobral" data-width="340" data-height="150" data-theme="default"></div>
                <script src="//cdn.jsdelivr.net/github-cards/latest/widget.js"></script>
            </div>

            <div class="sponsor-container">
                <iframe src="https://github.com/sponsors/thazsobral/button" title="Sponsor thazsobral" height="32" width="114" style="border: 0; border-radius: 6px;"></iframe>
            </div>

            <div id="reserved-rights">
                <p>
                    © <fragment id="current-year"></fragment> Made with 🤍 by ThazSobral.<br>
                    Todos os direitos reservados.
                </p>
                <script src="./assets/scripts/get-year.js"></script>
            </div>
        </div>
    </footer>
</body>
</html>
